version: '3.8'

services:
  user-service: 
    build: 
      context: ./user-service
    ports:
      - "5001:5001" 
    
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "5000:5000"
    environment:
      - USER_SERVICE_URL=http://user-service:5001
    depends_on:
      - user-service
